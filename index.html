<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ifis énekek</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <header>
    <h1>Ifis énekek</h1>
    <p>Pasaréti ifjúsági énekek gyűjteménye</p>
  </header>

  <form id="searchForm" class="main-controls" role="search">
  <label class="control-field control-search">
    <span>Keresés</span>
    <input id="search" type="search" placeholder="Keresés címre vagy sorszámra…" autocomplete="off" aria-label="Ének keresése">
  </label>

  <label class="control-field control-group">
    <span>Csoport</span>
    <select id="groupFilter" aria-label="Csoport szűrése">
      <option value="all">Összes csoport</option>
      <option value="berea">Bérea</option>
      <option value="csillag">Csillag, csillag…</option>
      <option value="gitar">Gitár</option>
      <option value="joel">Jóel</option>
      <option value="jonathan">Jonathán</option>
      <option value="joseb">Jóseb</option>
      <option value="nehemias">Nehémiás</option>
      <option value="salamon">Salamon</option>
    </select>
  </label>

  <label class="control-field control-sort">
    <span>Rendezés</span>
    <select id="sortMode">
          <option value="abc">ABC</option>
          <option value="number">Sorszám</option>
        </select>
  </label>
</form>

  <div id="status" class="status" aria-live="polite"></div>
  <div id="count" class="count"></div>
  <section id="results" class="results"></section>
</main>
<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>
